name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: PR validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: discord_bot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d discord_bot_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
          --add-host=host.docker.internal:host-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.sum
      - run: npm ci
      - run: npm run api:generate
      - run: go generate ./...
        working-directory: backend
      - name: Check generated artifacts
        run: |
          git diff --exit-code -- api/generated src/api/generated backend
          test -z "$(git ls-files --others --exclude-standard api/generated src/api/generated backend)"
      - name: Check Go
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go test -race ./...
          go build ./cmd/...
      - run: npm run check
      - run: npm test
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-test-only@localhost:5432/discord_bot_test
          TEST_DB_CONTAINER_ID: ${{ job.services.postgres.id }}
      - name: Go API, PostgreSQL and Discord UI integration
        run: npm run test:api-integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-test-only@localhost:5432/discord_bot_test_http
          TEST_DB_CONTAINER_ID: ${{ job.services.postgres.id }}
      - run: npm run build-only
