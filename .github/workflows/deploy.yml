name: Publish Raspberry Pi image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: discord-bot-ghcr-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/yone-k/yone-discord-bot

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: discord_bot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d discord_bot_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
          --add-host=host.docker.internal:host-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: backend/go.sum
      - run: npm ci
      - run: npm run api:generate
      - run: go generate ./...
        working-directory: backend
      - name: Check generated artifacts
        run: |
          git diff --exit-code -- api/generated src/api/generated backend
          test -z "$(git ls-files --others --exclude-standard api/generated src/api/generated backend)"
      - name: Check Go
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go test -race ./...
          go build ./cmd/...
      - run: npm run check
      - run: npm test
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-test-only@localhost:5432/discord_bot_test
          TEST_DB_CONTAINER_ID: ${{ job.services.postgres.id }}
      - name: Go API, PostgreSQL and Discord UI integration
        run: npm run test:api-integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-test-only@localhost:5432/discord_bot_test_http
          TEST_DB_CONTAINER_ID: ${{ job.services.postgres.id }}
      - run: npm run build-only
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build ARM64 image once
        run: |
          docker buildx build --platform linux/arm64 --load \
            --label "org.opencontainers.image.source=https://github.com/yone-k/yone-discord-bot" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "io.github.yone-k.build-run=$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
            --tag "$IMAGE:$GITHUB_SHA" .
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE:$GITHUB_SHA")" = linux/arm64
          docker run --rm --network none --entrypoint node "$IMAGE:$GITHUB_SHA" -e \
            "const fs=require('fs');for(const p of ['db/migrations/001_initial.sql','db/migrations/002_ent_uuidv7.sql','bin/core-api','bin/db-migrate']) fs.accessSync(p);for(const p of ['dist/migration','dist/db','dist/scripts/migrate-sheets-to-postgres.js']) if(fs.existsSync(p)) process.exit(1);"
          test -z "$(docker run --rm --network none --entrypoint sh "$IMAGE:$GITHUB_SHA" -c \
            'find /app -path /app/node_modules -prune -o -type f \( -name ".env*" -o -name "*.dump" -o -name "*.key" -o -name "*.pem" \) -print')"
          # Startup must reject an unavailable Core API before Discord login.
          check_log=$(mktemp)
          if docker run --rm --network none --entrypoint node \
            -e DISCORD_BOT_TOKEN=synthetic -e CLIENT_ID=123 \
            -e CORE_API_URL=http://127.0.0.1:1 -e CORE_API_TOKEN=synthetic \
            "$IMAGE:$GITHUB_SHA" dist/index.js > "$check_log" 2>&1; then
            rm -f "$check_log"; exit 1
          fi
          if grep -q 'GOOGLE_' "$check_log"; then rm -f "$check_log"; exit 1; fi
          rm -f "$check_log"
          bash scripts/check-core-image.sh "$IMAGE:$GITHUB_SHA"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only the current main revision
        id: publish
        run: bash scripts/publish-image.sh
    outputs:
      published: ${{ steps.publish.outputs.published }}
      digest: ${{ steps.publish.outputs.digest }}

  deploy:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Connect to the Pi network
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:discord-bot-ci
          ping: ${{ vars.PI_TAILSCALE_HOST }}
      - name: Deploy and verify the published image
        env:
          PI_HOST: ${{ vars.PI_TAILSCALE_HOST }}
          SSH_KEY: ${{ secrets.PI_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.PI_SSH_KNOWN_HOSTS }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PI_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -T -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -i "$ssh_dir/key" \
            "yone@$PI_HOST" "deploy $DIGEST"
