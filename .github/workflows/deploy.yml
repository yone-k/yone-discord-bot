name: Publish Raspberry Pi image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: discord-bot-ghcr-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/yone-k/yone-discord-bot

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build ARM64 image once
        run: |
          docker buildx build --platform linux/arm64 --load \
            --label "org.opencontainers.image.source=https://github.com/yone-k/yone-discord-bot" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "io.github.yone-k.build-run=$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
            --tag "$IMAGE:$GITHUB_SHA" .
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE:$GITHUB_SHA")" = linux/arm64
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only the current main revision
        run: bash scripts/publish-image.sh
