          $ref: '#/components/schemas/Id'
        consume:
          $ref: '#/components/schemas/Quantity'
    InventoryDisplay:
      type: object
      required:
        - channel
        - items
      properties:
        channel:
          $ref: '#/components/schemas/InventoryChannel'
        items:
          type: array
          items:
            $ref: '#/components/schemas/StoredInventoryItem'
    InventoryEditItem:
      type: object
      required:
        - name
