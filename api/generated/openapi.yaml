        - category
        - id
      properties:
        name:
          type: string
        stock:
          $ref: '#/components/schemas/Quantity'
        category:
          type: string
          nullable: true
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          minLength: 1
          description: Existing opaque ID.
    InventoryItemInput:
      type: object
      required:
        - name
        - stock
        - category
      properties:
        name:
          type: string
        stock:
          $ref: '#/components/schemas/Quantity'
        category:
