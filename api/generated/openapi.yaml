security:
  - BearerAuth: []
components:
  parameters:
    RequestOptions:
      name: X-Core-Timeout-Ms
      in: header
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 5000
  schemas:
    ApiError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - invalid_input
            - not_found
            - conflict
            - shortage
            - referenced
            - unauthorized
            - unavailable
            - internal
        reason:
          type: string
          enum:
            - duplicate_name
          description: duplicate_name distinguishes a duplicate name from other invalid_input failures. Inventory-add callers can skip that item and continue; other failures must not be silently skipped.
        target:
          type: string
        channelId:
          $ref: '#/components/schemas/Id'
        id:
          $ref: '#/components/schemas/Id'
        shortages:
          type: array
          items:
            $ref: '#/components/schemas/Shortage'
        references:
          type: array
          items:
            $ref: '#/components/schemas/StoredRemindTask'
    ApplyInventoryInput:
      type: object
      required:
        - expected
        - items
      properties:
        expected:
          type: array
          items:
            $ref: '#/components/schemas/InventoryEditItem'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApplyInventoryItem'
    ApplyInventoryItem:
      type: object
      required:
        - name
        - stock
        - category
      properties:
        name:
          type: string
        stock:
          $ref: '#/components/schemas/Quantity'
        category:
          type: string
          nullable: true
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          minLength: 1
          description: Omit for a new item; the server allocates UUIDv7. Otherwise identify an existing item.
    BulkInventoryInput:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryEditItem'
    BusinessDate:
      type: string
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
    BusinessTime:
      type: string
      pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
    ChannelPatch:
      type: object
      properties:
        messageId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        listTitle:
          type: string
        operationLogThreadId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
    ChannelSettings:
      type: object
      required:
        - channelId
        - messageId
        - listTitle
        - operationLogThreadId
      properties:
        channelId:
          $ref: '#/components/schemas/Id'
        messageId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        listTitle:
          type: string
        operationLogThreadId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
    CompleteTaskInput:
      type: object
      required:
        - expectedRevision
      properties:
        expectedRevision:
          $ref: '#/components/schemas/Revision'
        consumeOverrides:
          type: array
          items:
            $ref: '#/components/schemas/ConsumptionOverride'
    ConsumptionOverride:
      type: object
      required:
        - name
        - consume
      properties:
        name:
          type: string
        consume:
          type: string
          allOf:
            - $ref: '#/components/schemas/Quantity'
          nullable: true
      description: Parsed completion entry. null means the user omitted a quantity; the server applies the stored consumption rules.
    CreateTaskInput:
      type: object
      required:
        - title
        - description
        - intervalDays
        - timeOfDay
        - remindBeforeMinutes
        - inventoryItems
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        intervalDays:
          $ref: '#/components/schemas/IntervalDays'
        timeOfDay:
          $ref: '#/components/schemas/BusinessTime'
        remindBeforeMinutes:
          $ref: '#/components/schemas/ReminderMinutes'
        inventoryItems:
          type: array
          items:
            $ref: '#/components/schemas/InventoryConsumption'
    EditTaskInventoryInput:
      type: object
      required:
        - expectedRevision
        - items
      properties:
        expectedRevision:
          $ref: '#/components/schemas/Revision'
        items:
          type: array
          items:
            $ref: '#/components/schemas/RemindInventoryEdit'
    ExpectedRevisionInput:
      type: object
      required:
        - expectedRevision
      properties:
        expectedRevision:
          $ref: '#/components/schemas/Revision'
    Health:
      type: object
      required:
        - ready
      properties:
        ready:
          type: boolean
    Id:
      type: string
      description: Opaque legacy business ID or Discord ID; never assume globally unique or UUID.
    Initialization:
      type: object
      required:
        - lists
        - inventories
        - reminders
        - remindChannels
      properties:
        lists:
          type: array
          items:
            $ref: '#/components/schemas/ListDisplay'
        inventories:
          type: array
          items:
            $ref: '#/components/schemas/InventoryDisplay'
        reminders:
          type: array
          items:
            $ref: '#/components/schemas/TaskDisplay'
        remindChannels:
          type: array
          items:
            $ref: '#/components/schemas/RemindChannel'
    IntervalDays:
      type: integer
      format: int32
      minimum: 1
    InventoryChannel:
      type: object
      required:
        - channelId
        - messageId
        - listTitle
        - operationLogThreadId
        - defaultCategory
      properties:
        channelId:
          $ref: '#/components/schemas/Id'
        messageId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        listTitle:
          type: string
        operationLogThreadId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        defaultCategory:
          type: string
    InventoryChannelPatch:
      type: object
      properties:
        messageId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        listTitle:
          type: string
        operationLogThreadId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        defaultCategory:
          type: string
    InventoryConsumption:
      type: object
      required:
