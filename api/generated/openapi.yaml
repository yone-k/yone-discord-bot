security:
  - BearerAuth: []
components:
  parameters:
    OutputActorHeaders.actorId:
      name: X-Actor-Id
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    OutputActorHeaders.interactionId:
      name: X-Interaction-Id
      in: header
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    OutputActorHeaders.operationKind:
      name: X-Operation-Kind
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/OutputOperationKind'
    RequestOptions:
      name: X-Core-Timeout-Ms
      in: header
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 5000
  schemas:
    ApiError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - invalid_input
            - not_found
            - conflict
            - shortage
            - referenced
            - unauthorized
            - unavailable
            - internal
        reason:
          type: string
          enum:
            - duplicate_name
          description: duplicate_name distinguishes a duplicate name from other invalid_input failures. Inventory-add callers can skip that item and continue; other failures must not be silently skipped.
        target:
          type: string
        channelId:
          $ref: '#/components/schemas/Id'
        id:
          $ref: '#/components/schemas/Id'
        shortages:
          type: array
          items:
            $ref: '#/components/schemas/Shortage'
        references:
          type: array
          items:
            $ref: '#/components/schemas/StoredRemindTask'
    AppendInventoryItemsInput:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItemInput'
          minItems: 1
    AppendInventoryItemsResult:
      type: object
      required:
        - skippedNames
      properties:
        skippedNames:
          type: array
          items:
            type: string
    ApplyInventoryInput:
      type: object
      required:
        - expected
        - items
      properties:
        expected:
          type: array
          items:
            $ref: '#/components/schemas/InventoryEditItem'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApplyInventoryItem'
    ApplyInventoryItem:
      type: object
      required:
        - name
        - stock
        - category
      properties:
        name:
          type: string
        stock:
          $ref: '#/components/schemas/Quantity'
        category:
          type: string
          nullable: true
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          minLength: 1
          description: Omit for a new item; the server allocates UUIDv7. Otherwise identify an existing item.
    BulkInventoryInput:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryEditItem'
    BusinessDate:
      type: string
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
    BusinessTime:
      type: string
      pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
    ChannelPatch:
      type: object
      properties:
        listTitle:
          type: string
    ChannelSettings:
      type: object
      required:
        - channelId
        - messageId
        - listTitle
        - operationLogThreadId
      properties:
        channelId:
          $ref: '#/components/schemas/Id'
        messageId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        listTitle:
          type: string
        operationLogThreadId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
    CompleteTaskInput:
