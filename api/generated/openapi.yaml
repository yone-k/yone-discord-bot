        - channelId
        - lastNotifiedAt
        - position
      properties:
        name:
          type: string
        category:
          type: string
          nullable: true
        until:
          type: string
          allOf:
            - $ref: '#/components/schemas/BusinessDate'
          nullable: true
        isCompleted:
          type: boolean
        id:
          $ref: '#/components/schemas/Id'
        channelId:
          $ref: '#/components/schemas/Id'
        lastNotifiedAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        position:
          $ref: '#/components/schemas/NonnegativeInteger'
    StoredRemindTask:
      type: object
      required:
        - title
        - description
        - intervalDays
        - timeOfDay
        - remindBeforeMinutes
        - inventoryItems
        - channelId
        - id
        - messageId
        - startAt
        - nextDueAt
        - lastDoneAt
        - lastRemindDueAt
        - overdueNotifyCount
        - overdueNotifyLimit
        - lastOverdueNotifiedAt
        - isPaused
        - createdAt
        - updatedAt
        - revision
        - position
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        intervalDays:
          $ref: '#/components/schemas/IntervalDays'
        timeOfDay:
          $ref: '#/components/schemas/BusinessTime'
        remindBeforeMinutes:
          $ref: '#/components/schemas/ReminderMinutes'
        inventoryItems:
          type: array
          items:
            $ref: '#/components/schemas/InventoryConsumption'
        channelId:
          $ref: '#/components/schemas/Id'
        id:
          $ref: '#/components/schemas/Id'
        messageId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        startAt:
          $ref: '#/components/schemas/Timestamp'
        nextDueAt:
          $ref: '#/components/schemas/Timestamp'
        lastDoneAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        lastRemindDueAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        overdueNotifyCount:
          $ref: '#/components/schemas/NonnegativeInteger'
        overdueNotifyLimit:
          type: integer
          allOf:
            - $ref: '#/components/schemas/NonnegativeInteger'
          nullable: true
        lastOverdueNotifiedAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        isPaused:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        revision:
          $ref: '#/components/schemas/Revision'
        position:
          $ref: '#/components/schemas/NonnegativeInteger'
    TaskDisplay:
      type: object
      required:
        - channel
        - task
        - shortages
      properties:
        channel:
          $ref: '#/components/schemas/RemindChannel'
        task:
          $ref: '#/components/schemas/StoredRemindTask'
        shortages:
          type: array
          items:
            $ref: '#/components/schemas/Shortage'
    TaskPatch:
      type: object
      properties:
        messageId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        intervalDays:
          $ref: '#/components/schemas/IntervalDays'
        timeOfDay:
          $ref: '#/components/schemas/BusinessTime'
        remindBeforeMinutes:
          $ref: '#/components/schemas/ReminderMinutes'
        overdueNotifyLimit:
          type: integer
          allOf:
            - $ref: '#/components/schemas/NonnegativeInteger'
          nullable: true
        lastDoneAt:
          type: string
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
          description: Explicit manual override from the task detail settings UI, not task completion.
        nextDueAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
