    Timestamp:
      type: string
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}(?:Z|[+-][0-9]{2}:[0-9]{2})$
      description: RFC3339 timestamp with exactly millisecond precision; business timezone is Asia/Tokyo.
