        - inventoryChannelId
      properties:
        inventoryChannelId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
    ListChannel:
      type: object
      required:
        - channelId
        - messageId
        - listTitle
        - operationLogThreadId
        - defaultCategory
        - editVersion
      properties:
        channelId:
          $ref: '#/components/schemas/Id'
        messageId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        listTitle:
          type: string
        operationLogThreadId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        defaultCategory:
          type: string
        editVersion:
          $ref: '#/components/schemas/Revision'
    ListChannelInput:
      type: object
      required:
        - channelId
        - messageId
        - listTitle
        - operationLogThreadId
        - defaultCategory
      properties:
        channelId:
          $ref: '#/components/schemas/Id'
        messageId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        listTitle:
          type: string
        operationLogThreadId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        defaultCategory:
          type: string
    ListChannelPatch:
      type: object
      properties:
        messageId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        listTitle:
          type: string
        operationLogThreadId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        defaultCategory:
          type: string
    ListDisplay:
      type: object
      required:
        - channel
        - items
      properties:
        channel:
          $ref: '#/components/schemas/ListChannel'
        items:
          type: array
          items:
            $ref: '#/components/schemas/StoredListItem'
    ListEditItem:
      type: object
      required:
        - name
        - category
        - until
        - isCompleted
      properties:
        name:
          type: string
        category:
          type: string
          nullable: true
        until:
          type: string
          allOf:
            - $ref: '#/components/schemas/BusinessDate'
          nullable: true
        isCompleted:
          type: boolean
    ListSnapshot:
      type: object
      required:
        - items
        - editVersion
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StoredListItem'
        editVersion:
          $ref: '#/components/schemas/Revision'
    NonnegativeInteger:
      type: integer
      format: int32
      minimum: 0
    Notification:
      type: object
      required:
        - kind
        - channelId
        - id
        - evaluatedAt
        - targetDueAt
        - expectedRevision
        - list
        - item
        - reminder
      properties:
        kind:
          type: string
          enum:
            - list
            - before
            - overdue
        channelId:
          $ref: '#/components/schemas/Id'
        id:
          $ref: '#/components/schemas/Id'
        evaluatedAt:
          $ref: '#/components/schemas/Timestamp'
        targetDueAt:
          allOf:
            - $ref: '#/components/schemas/NotificationDeadline'
          description: BusinessDate for list notifications, Timestamp for reminder notifications.
        expectedRevision:
          type: string
          allOf:
            - $ref: '#/components/schemas/Revision'
          nullable: true
          description: null for list notifications; the captured task revision for reminders.
        list:
          type: object
          allOf:
            - $ref: '#/components/schemas/ListDisplay'
          nullable: true
        item:
          type: object
          allOf:
            - $ref: '#/components/schemas/StoredListItem'
          nullable: true
        reminder:
          type: object
          allOf:
            - $ref: '#/components/schemas/TaskDisplay'
          nullable: true
      description: kind=list requires non-null list and item with null reminder. kind=before or overdue requires non-null reminder with null list and item. Reminder deadlines are timestamps and revisions are non-null; list deadlines are dates and revisions are null.
    NotificationAckResult:
      type: object
      required:
        - item
        - task
      properties:
        item:
          type: object
          allOf:
            - $ref: '#/components/schemas/StoredListItem'
          nullable: true
        task:
          type: object
          allOf:
            - $ref: '#/components/schemas/StoredRemindTask'
          nullable: true
    NotificationDeadline:
      type: string
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}(?:T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}(?:Z|[+-][0-9]{2}:[0-9]{2}))?$
      description: List deadline (YYYY-MM-DD) or reminder deadline (RFC3339 with milliseconds). kind selects the applicable representation.
    NotificationPlan:
      type: object
      required:
        - evaluatedAt
        - notifications
        - progress
      properties:
        evaluatedAt:
          $ref: '#/components/schemas/Timestamp'
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        progress:
          type: array
          items:
            $ref: '#/components/schemas/ProgressUpdate'
    NotificationToken:
      type: object
      required:
        - kind
        - channelId
        - id
        - evaluatedAt
        - targetDueAt
        - expectedRevision
      properties:
        kind:
          type: string
          enum:
            - list
            - before
            - overdue
        channelId:
          $ref: '#/components/schemas/Id'
        id:
          $ref: '#/components/schemas/Id'
        evaluatedAt:
          $ref: '#/components/schemas/Timestamp'
        targetDueAt:
          allOf:
            - $ref: '#/components/schemas/NotificationDeadline'
          description: BusinessDate for list notifications, Timestamp for reminder notifications.
        expectedRevision:
          type: string
          allOf:
            - $ref: '#/components/schemas/Revision'
          nullable: true
          description: null for list notifications; the captured task revision for reminders.
    PatchTaskInput:
      type: object
      required:
        - expectedRevision
        - patch
      properties:
        expectedRevision:
          $ref: '#/components/schemas/Revision'
        patch:
          $ref: '#/components/schemas/TaskPatch'
    PathId:
      type: string
      description: Path representation of an ID. For '.', '..', an ID containing '/' or '%', or an ID starting with '~', use '~' followed by unpadded base64url of the UTF-8 ID. Otherwise use ordinary URI component encoding. JSON and query IDs retain their original values.
    ProgressUpdate:
      type: object
      required:
        - kind
        - reminder
        - evaluatedAt
      properties:
        kind:
          type: string
          enum:
            - progress
        reminder:
          $ref: '#/components/schemas/TaskDisplay'
        evaluatedAt:
          $ref: '#/components/schemas/Timestamp'
    Quantity:
      type: string
      pattern: ^[0-9]+(?:\.[0-9]+)?$
      description: Arbitrary precision, unsigned decimal. Never convert through a binary float.
    RemindChannel:
      type: object
      required:
        - channelId
        - messageId
        - listTitle
        - operationLogThreadId
        - remindNoticeThreadId
        - remindNoticeMessageId
        - linkedInventoryChannelId
      properties:
        channelId:
          $ref: '#/components/schemas/Id'
        messageId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        listTitle:
          type: string
        operationLogThreadId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        remindNoticeThreadId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        remindNoticeMessageId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        linkedInventoryChannelId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
    RemindChannelPatch:
      type: object
      properties:
        messageId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        listTitle:
          type: string
        operationLogThreadId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        remindNoticeThreadId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        remindNoticeMessageId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
    RemindInventoryEdit:
      type: object
      required:
        - name
        - consume
      properties:
        name:
          type: string
        stock:
          $ref: '#/components/schemas/Quantity'
        consume:
          $ref: '#/components/schemas/Quantity'
    RemindInventoryEditResult:
      type: object
      required:
        - task
        - inventoryChannelId
        - stockChanged
      properties:
        task:
          $ref: '#/components/schemas/StoredRemindTask'
        inventoryChannelId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        stockChanged:
          type: boolean
    ReminderMinutes:
